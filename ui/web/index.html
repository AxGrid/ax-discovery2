<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Apply the persisted theme before first paint to avoid FOUC. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ax-styler-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <title>discovery</title>
    <meta name="description" content="Service discovery — registry, load balancing, health checks, and an audit trail." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme — switches with the user's light/dark preference, matches our brand. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />
    <meta name="color-scheme" content="light dark" />

    <!-- Mobile / iOS niceties -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="discovery" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter (only meaningful when behind a domain) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="discovery" />
    <meta property="og:description" content="Service discovery — registry, load balancing, health checks, and an audit trail." />
    <meta property="og:image" content="/apple-touch-icon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="discovery" />
    <meta name="twitter:description" content="Service discovery — registry, load balancing, health checks, and an audit trail." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
